name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crop
          POSTGRES_PASSWORD: crop
          POSTGRES_DB: crop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crop" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://crop:crop@localhost:5432/crop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crop/db build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
