name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crop
          POSTGRES_PASSWORD: crop
          POSTGRES_DB: crop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crop" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://crop:crop@localhost:5432/crop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crop/db build
      - run: pnpm typecheck
      - name: Test
        run: pnpm test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report test failures
        # Puts the end of the test output into an annotation, readable through the API as well as on the PR.
        if: failure()
        run: |
          body=$(grep -vE '^\s*$' test.log | grep -E -B2 -A12 'FAIL|Error|×' | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Test failures::${body}"
      - run: pnpm build
