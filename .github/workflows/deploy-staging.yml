name: Deploy staging
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-staging

jobs:
  deploy:
    # Skipped until the STAGING_HOST repository variable is set (Settings → Secrets and variables → Actions → Variables).
    if: vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ vars.STAGING_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts
      - name: Store service keys kept in GitHub
        # Optional keys David can add as repository secrets instead of logging in to the server.
        # Values go over SSH on stdin (never on a command line) and replace any old line in /srv/crop/.env.
        env:
          HOST: ${{ vars.STAGING_HOST }}
          CLICKSEND_USERNAME: ${{ secrets.CLICKSEND_USERNAME }}
          CLICKSEND_API_KEY: ${{ secrets.CLICKSEND_API_KEY }}
        run: |
          lines=""; names=""
          for k in CLICKSEND_USERNAME CLICKSEND_API_KEY; do
            v="${!k}"
            if [ -n "$v" ]; then lines+="$k=$v"$'\n'; names+="$k "; fi
          done
          if [ -z "$lines" ]; then echo "No service keys in GitHub secrets; leaving the server's settings as they are."; exit 0; fi
          # Remove the old lines for these names (fixed names, safe on a command line), then append the new values from stdin.
          for k in $names; do ssh crop@"$HOST" "sed -i '/^$k=/d' /srv/crop/.env"; done
          printf '%s' "$lines" | ssh crop@"$HOST" 'umask 077; cat >> /srv/crop/.env'
          echo "Stored: $names"
      - name: Copy release and start
        env:
          HOST: ${{ vars.STAGING_HOST }}
        run: |
          git archive --format=tar HEAD | ssh crop@"$HOST" 'rm -rf /srv/crop/app.new && mkdir -p /srv/crop/app.new && tar -x -C /srv/crop/app.new'
          ssh crop@"$HOST" "set -e
            rm -rf /srv/crop/app.old; [ -d /srv/crop/app ] && mv /srv/crop/app /srv/crop/app.old
            mv /srv/crop/app.new /srv/crop/app
            grep -q '^SESSION_SECRET=' /srv/crop/.env || (umask 077; echo \"SESSION_SECRET=\$(openssl rand -hex 32)\" >> /srv/crop/.env)
            cd /srv/crop/app/deploy/staging
            APP_VERSION=${GITHUB_SHA::7} docker compose --env-file /srv/crop/.env up -d --build --remove-orphans
            # Each deploy unpacks into a fresh folder; recreate Caddy so it mounts the new Caddyfile and site files.
            docker compose --env-file /srv/crop/.env up -d --force-recreate --no-deps caddy
            docker image prune -f"
      - name: Check health
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://staging.cropwms.com/api/health && exit 0
            sleep 5
          done
          exit 1
