name: Reset C4U demo day on staging
# Run from the Actions tab ("Run workflow"). Deletes the staging business Caring For You's (cfy) data (keeping the
# business, real sign-ins, settings, words and set-up) and fills it with an invented, realistic agency day: 14 days of
# history, today and the next 3 days. Without RESET it only reports what it would delete. Staging only.
on:
  workflow_dispatch:
    inputs:
      day:
        description: The demo's today (YYYY-MM-DD, Melbourne); leave empty for today
        required: false
        default: ''
      confirm:
        description: Type RESET to delete and reseed (anything else is a dry run)
        required: false
        default: ''

concurrency: deploy-staging

jobs:
  demo-day:
    if: vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ vars.STAGING_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts
      - name: Reset the demo day
        env:
          HOST: ${{ vars.STAGING_HOST }}
          DAY: ${{ inputs.day }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # Validate before anything reaches a remote shell.
          [[ -z "$DAY" || "$DAY" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]] || { echo "day: YYYY-MM-DD or empty"; exit 1; }
          [[ -z "$CONFIRM" || "$CONFIRM" =~ ^[A-Za-z]{1,10}$ ]] || { echo "confirm: type RESET"; exit 1; }
          ARGS="--tenant cfy"
          [[ -n "$DAY" ]] && ARGS="$ARGS --day $DAY"
          [[ "$CONFIRM" == "RESET" ]] && ARGS="$ARGS --confirm RESET"
          ssh crop@"$HOST" "cd /srv/crop/app/deploy/staging && docker compose --env-file /srv/crop/.env run --rm -T -e CROP_ENV=staging migrate \
            node dist/demo/demo-day-cli.js $ARGS"
