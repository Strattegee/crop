name: Build the worker app
# Started by hand (Actions › Build the worker app › Run workflow). Builds on Expo's servers (EAS) and puts the
# install link on the Expo dashboard. Needs the EXPO_TOKEN secret (an Expo access token David creates; never in code).
# "preview" = a test build that talks to staging, installed straight on a phone (Android now; iOS once Apple
# approves the developer account and the phone is registered). "simulator" = an iOS build for the iPhone simulator
# on a Mac (Xcode), no Apple account needed; choose ios with it.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which phones
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Build type
        type: choice
        options: [preview, simulator, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Check the Expo token is set
        working-directory: .
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=No Expo token::Add the EXPO_TOKEN secret in GitHub (Settings › Secrets and variables › Actions) first."
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Link the app to the Expo account
        # Creates the "crop-worker" project in the token's account the first time; later runs find it.
        run: |
          eas init --non-interactive --force
          echo "Expo project: $(node -e "console.log(require('./app.json').expo.extra?.eas?.projectId ?? 'not set')")"
          git diff --stat -- app.json || true
      - name: Build on Expo's servers
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
