# Staging stack on the crop-staging droplet. Secrets come from /srv/crop/.env (see README.md here).
name: crop
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /srv/crop/.env}
      POSTGRES_DB: crop
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crop -d crop"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    image: crop-api:latest
    command: ["node", "node_modules/@crop/db/dist/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://crop:${POSTGRES_PASSWORD}@postgres:5432/crop
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in /srv/crop/.env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    # Same build as migrate (cached), so compose never tries to pull crop-api from a registry.
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    image: crop-api:latest
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgres://crop_app:${APP_DB_PASSWORD}@postgres:5432/crop
      API_PORT: "4000"
      WEB_ORIGINS: https://staging.cropwms.com
      APP_VERSION: ${APP_VERSION:-unknown}
      AUTH_ISSUER: https://crop-wms-g1hp69.au1.zitadel.cloud
      AUTH_AUDIENCE: "396208029055362428"   # Zitadel CROP project ID
      # Credential documents: DigitalOcean Spaces, Sydney. Keys live in /srv/crop/.env.
      SPACES_BUCKET: crop-staging-docs
      SPACES_ENDPOINT: https://syd1.digitaloceanspaces.com
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      # Email (Resend) and SMS (ClickSend). Keys live in /srv/crop/.env; sending is off for a channel until its keys are set.
      NOTIFY_FROM_EMAIL: CROP <noreply@cropwms.com>
      APP_URL: https://staging.cropwms.com   # links in messages
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CLICKSEND_USERNAME: ${CLICKSEND_USERNAME:-}
      CLICKSEND_API_KEY: ${CLICKSEND_API_KEY:-}
      CLICKSEND_FROM: ${CLICKSEND_FROM:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    image: crop-web:latest
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      APP_URL: https://staging.cropwms.com
      AUTH_ISSUER: https://crop-wms-g1hp69.au1.zitadel.cloud
      AUTH_CLIENT_ID: "396208644041057660"  # Zitadel app "CROP web" (Client ID, not the app resource ID)
      AUTH_PROJECT_ID: "396208029055362428"
      SESSION_SECRET: ${SESSION_SECRET:?generated into /srv/crop/.env by the deploy workflow}
    depends_on: [api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
